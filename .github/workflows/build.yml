
name: Build Musica

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Musica
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extraer proyecto
        run: |
          unzip -q MusicPlayer.zip -d project
          PROJECT_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró el proyecto Gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Buscar APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Musica-APK
          path: ${{ env.APK_PATH }}

